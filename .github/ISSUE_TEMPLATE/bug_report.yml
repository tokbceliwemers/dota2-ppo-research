name: Bug report
description: Report a reproducible problem in the local research workflow.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Please do not include replay files, checkpoints, credentials, account IDs, or public-match material."
  - type: input
    id: component
    attributes:
      label: Component
      description: "For example: replay parser, PPO bridge, lane addon, simulator, or docs."
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Exact command and sanitized output
      render: powershell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: "OS, Python version, PyTorch version, and GPU if relevant."
    validations:
      required: true
